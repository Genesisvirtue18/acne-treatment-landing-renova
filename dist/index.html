27",plan:"Subcision + 4 × VirtuEx fractional laser",duration:"6 months"},{id:2,before:"/images/before2.jpg",after:"/images/after2.jpg",title:"Deep icepick scarring, both cheeks",patient:"Male, 31",plan:"5 × VirtuEx Erbium+ co2 + QLARA toning",duration:"9 months"},{id:3,before:"/images/before3.jpg",after:"/images/after3.jpg",title:"Post-acne pigmentation & shallow scars",patient:"Female, 24",plan:"6 × QLARA laser toning + medical topicals",duration:"4 months"}],Te={name:"Dr. Bhawna Bhardwaj",role:"Senior Consultant Dermatologist & Hair Transplant Surgeon",quote:"The right protocol for the right patient — not the most-marketed treatment of the month.",rating:"4.9/5",bio:"MBBS, DVDL (Skin & VD). Dr. Bhardwaj is a senior consultant dermatologist and hair transplant surgeon whose practice combines medical dermatology with surgical hair restoration. She trained in skin & VD at a leading Indian medical institution and has spent the last 15+ years building expertise across acne and scar management, melasma protocols calibrated for Indian skin, surgical hair transplant techniques (FUE, DHT, beard, eyebrow), and energy-based aesthetic devices. Patients consistently describe her consultations as unhurried, honest, and detail-oriented.",credentials:[{tag:"MBBS",title:"Bachelor of Medicine, Bachelor of Surgery",desc:"Foundational medical training in clinical medicine and surgery."},{tag:"DVDL",title:"Diploma in Venereology, Dermatology and Leprosy",desc:"Specialised post-graduate training in clinical and cosmetic dermatology with focus on Indian skin types."},{tag:"FUE",title:"Hair Transplant Surgery Certification",desc:"Advanced training in Follicular Unit Extraction, DHI Choi-pen, beard and eyebrow transplantation."},{tag:"✦",title:"Aesthetic & Laser Dermatology",desc:"Multi-platform certification across diode, Nd:YAG, Q-switch and RF-based aesthetic devices."}],expertise:["Acne & Acne Scar Management","Pigmentation & Melasma (Cosmelan)","Q-Switch & Tattoo Removal","Skin Tightening","Anti-Wrinkle Therapy (Botox)","Dermal Fillers","Laser Hair Reduction","FUE Hair Transplant","DHT Hair Transplant","Beard & Eyebrow Restoration","Female Hair Transplant"]},vh=[{quote:"Honest consult, no rush, no upsell. That's why I drive across the city for my monthly visit.",name:"Aarti J.",treatment:"Acne Management"},{quote:"She didn't sell me a treatment, she diagnosed my melasma properly and built a plan I could actually follow. Three months in, the difference is real.",name:"Meera S.",treatment:"Cosmelan Protocol"},{quote:"Dr. Bhardwaj walked me through the entire plan before I committed to anything. A year on, my cheeks look completely different.",name:"Rohit K.",treatment:"Acne Scar Resurfacing"}],yh=[{n:"01",title:"Scar mapping consult",desc:"We photograph and map every scar type on your face — icepick, boxcar, rolling, pigment — because each responds to a different tool."},{n:"02",title:"Written treatment plan",desc:"You leave with a printed protocol: number of sessions, devices used, spacing, downtime and realistic percentage improvement."},{n:"03",title:"Combination therapy",desc:"Subcision and resurfacing release tethered scars, VirtuEx rebuilds collagen, QLARA clears the pigment left behind."},{n:"04",title:"Review & maintenance",desc:"Standardised photos at every visit, plus a barrier-repair and sun-protection routine so results hold."}],gh=[{q:"What are the causes of post-acne scars?",a:"Scars form when inflamed acne damages collagen in the deeper skin layers. The more severe, prolonged or repeatedly picked the breakout, the higher the risk. Early control of active acne is the best prevention."},{q:"What are the types of acne scars?",a:"The main types are ice-pick scars, boxcar scars and rolling scars. Many patients also have post-acne pigmentation or redness, which are not true scars but often need treatment alongside the texture changes."},{q:"What are stretch marks and why do they occur?",a:"Stretch marks are a separate type of skin change caused by rapid stretching of the skin, such as growth, pregnancy or weight changes. They are treated differently from acne scars, but we can guide you to the right plan if both are present."},{q:"What services are offered for acne scars and stretch marks?",a:"Depending on the skin concern, we may use chemical peels, microneedling, subcision, fractional lasers, PRP or GFC, and supportive medical skincare. The exact combination depends on scar type, skin tone and healing time."},{q:"What is chemical peeling?",a:"Chemical peeling uses a controlled medical solution to lift damaged surface layers and encourage smoother, more even skin renewal. It can help with acne, post-acne marks and dullness when used at the right strength."},{q:"What is microneedling?",a:"Microneedling creates tiny controlled channels in the skin to stimulate collagen and improve texture over time. It is often combined with other treatments for acne scars, pigmentation or stretch marks."},{q:"What is fractional CO2 laser and how does it work?",a:"Fractional lasers deliver energy in a patterned way so that small treatment zones are targeted while nearby skin is preserved for healing. In acne scar treatment, this helps remodel collagen and soften uneven texture with less downtime than older fully ablative lasers."},{q:"What is PRP?",a:"PRP stands for platelet-rich plasma, a preparation made from your own blood that is rich in growth factors. It is sometimes added to skin and hair procedures to support healing and recovery."},{q:"What does PRP or GFC do for skin?",a:"PRP and GFC are supportive regenerative treatments that may help with healing, collagen support and overall skin quality. They are not one-size-fits-all treatments and are best selected after a proper consultation."},{q:"Who can undergo these treatments?",a:"Most adults with stable health can be assessed for treatment, but timing matters. We usually stabilise active acne first, then choose scar procedures once inflammation is under control."},{q:"How do I choose the right procedure for maximum benefit?",a:"The right procedure depends on whether the main issue is active acne, pigmentation, tethered scars or volume loss. The best results usually come from a combined plan rather than one single device."},{q:"What are the post-procedure instructions?",a:"You will usually be asked to keep the skin clean, avoid picking, use sunscreen strictly, and pause irritating products for a short period. Your doctor will give instructions based on the exact treatment performed."},{q:"How frequently can I take my sessions?",a:"Session spacing depends on the treatment. Some procedures can be repeated after a few weeks, while deeper resurfacing treatments need more healing time between visits."},{q:"How many sittings will I require?",a:"The number of sittings depends on the depth of acne scars, how active the acne is, your skin type and how well you heal. Many patients need a staged plan over several months."},{q:"Is anesthesia required?",a:"For many acne scar procedures, a topical numbing cream is enough. Some deeper procedures may need additional comfort measures, which are discussed before treatment."},{q:"How will I know my treatment is successful?",a:"We track progress with standardised photographs, texture changes, fewer active breakouts, lighter pigment and smoother scars. Improvement should be visible over time, not just after one session."},{q:"How long will the effects last after the last session?",a:"Results can last well, especially when active acne is controlled and maintenance skincare is followed. Acne itself can recur, so long-term control is as important as scar revision."},{q:"Will I be given any medicine after the procedure?",a:"Some procedures are followed by supportive medicines or skincare to reduce irritation and protect healing. The exact aftercare plan depends on the treatment you receive."},{q:"Can acne scars be removed completely?",a:"Honest answer: no protocol erases scars 100%. With a correctly combined plan most patients see 60–85% improvement in scar depth, texture and shadowing. We show you standardised photographs at every review so progress is measurable, not marketing."},{q:"How many sessions will I need?",a:"Depending on the condition being treated, most patients benefit from 3–6 VirtuEx sessions spaced several weeks apart. Pigmentation on the QLARA may need a few sessions for superficial marks, and a longer gradual course for deeper pigment."},{q:"Is laser treatment painful?",a:"Most patients experience only mild discomfort. A topical numbing cream is applied 30–45 minutes before treatment, and cooling is used throughout the session."},{q:"Is it safe for Indian skin?",a:"Yes. Both platforms are depth- and energy-tunable. The QLARA's Smart MultiTone mode lets us calibrate gentle settings that are safe and effective across all Fitzpatrick types, and VirtuEx's fractional delivery preserves healthy tissue between microthermal zones."},{q:"What is the downtime?",a:"QLARA toning has minimal downtime — mild redness that settles within hours. VirtuEx fractional resurfacing typically leaves redness and a sandpaper texture for 2–4 days. Sunscreen is non-negotiable afterwards."},{q:"Should I treat active acne first?",a:"Yes. Resurfacing an actively inflamed face risks new scarring and pigmentation. We stabilise active acne medically first, then move to scar revision — usually within 2–3 months."}];function ze({children:S}){return f.jsxs("span",{className:"inline-flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.22em] text-forest-600",children:[f.jsx("span",{className:"h-px w-6 bg-forest-600/50"}),S]})}function Oa({children:S,href:q="#book",variant:U="solid",className:m=""}){const H="inline-flex items-center justify-center gap-2 rounded-full px-6 py-3 text-sm font-semibold transition-all duration-300",Y=U==="solid"?"bg-forest-800 text-mint-50 hover:bg-forest-900 shadow-lg shadow-forest-800/20 hover:shadow-xl hover:-translate-y-0.5":"b
